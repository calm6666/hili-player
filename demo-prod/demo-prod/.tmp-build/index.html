<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hili Player · 构建产物验证</title>
<!--ssr-meta-outlet-->
<!--ssr-css-outlet-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .app-container{max-width:960px;margin:0 auto;padding:30px 20px}
  h1{color:#fff;font-size:26px;margin-bottom:6px}
  .subtitle{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:24px}
  .player-wrapper{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5)}
  .panel{width:100%;margin-top:20px;background:rgba(255,255,255,.04);border-radius:10px;padding:18px 20px}
  .panel-title{font-size:14px;font-weight:600;color:#00b4d8;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .btn{padding:6px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e0e0e0;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .2s;font-family:inherit}
  .btn:hover{background:rgba(255,255,255,.12)}
  .ssr-badge{position:fixed;top:16px;right:16px;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:600;z-index:999;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(8px);border:1px solid transparent}
  .ssr-badge.ssr{background:rgba(33,150,243,.15);color:#64b5f6;border-color:rgba(33,150,243,.4)}
  .ssr-badge.hydrated{background:rgba(76,175,80,.15);color:#81c784;border-color:rgba(76,175,80,.4)}
  .ssr-badge.failed{background:rgba(244,67,54,.15);color:#e57373}
  .debug-panel{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,.95);border-top:1px solid rgba(255,255,255,.08);z-index:990}
  .debug-h{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:rgba(255,255,255,.5)}
  .debug-h:hover{background:rgba(255,255,255,.04)}
  .debug-b{display:none;padding:12px 16px;gap:16px;font-family:'Courier New',monospace;font-size:11px;color:rgba(255,255,255,.6);max-height:200px;overflow-y:auto}
  .debug-panel.open .debug-b{display:flex}
  .debug-col{flex:1}
  .debug-col h4{color:rgba(255,255,255,.3);font-size:10px;text-transform:uppercase;margin-bottom:6px}
  .debug-row{display:flex;gap:8px;padding:2px 0}
  .debug-row .k{color:#00b4d8;flex-shrink:0}
  .debug-row .v.green{color:#4ade80}
  .debug-row .v.red{color:#f87171}
  .ssr-error-overlay{position:fixed;bottom:16px;left:16px;max-width:480px;padding:14px 16px;background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.4);backdrop-filter:blur(8px);border-radius:10px;color:#ef9a9a;font-size:12px;font-family:'Courier New',monospace;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ssr-error-overlay.show{display:block}
  .ssr-error-overlay .title{font-weight:700;margin-bottom:6px;color:#f87171}
</style>
  <script type="module" crossorigin src="/assets/index-BLKqOy8b.js"></script>
</head>
<body>
<div id="root"><!--ssr-outlet--></div>
<div id="ssr-badge" class="ssr-badge ssr"><span class="text">SSR</span></div>
<div id="ssr-error" class="ssr-error-overlay">
  <div class="title">SSR / Hydration Error</div>
  <div id="ssr-error-msg"></div>
</div>

<div id="debug" class="debug-panel">
  <div class="debug-h" id="debug-toggle">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Debug · 按 ` 切换
    <span style="margin-left:auto;display:flex;gap:10px">
      <span id="ind-ssr" style="color:#4ade80">SSR</span>
      <span id="ind-style" style="color:#4ade80">Style</span>
      <span id="ind-class" style="color:#4ade80">Class</span>
    </span>
  </div>
  <div class="debug-b">
    <div class="debug-col"><h4>SSR</h4><div id="dbg-ssr"></div></div>
    <div class="debug-col"><h4>Style</h4><div id="dbg-style"></div></div>
    <div class="debug-col"><h4>Class</h4><div id="dbg-class"></div></div>
    <div class="debug-col"><h4>Perf</h4><div id="dbg-perf"></div></div>
  </div>
</div>
</body>
</html>
